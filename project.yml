name: GroqDictate
options:
  deploymentTarget:
    macOS: "14.0"
    iOS: "17.0"
  xcodeVersion: "26.0"
  generateEmptyDirectories: false

settings:
  base:
    SWIFT_VERSION: "5.0"

schemes:
  GroqDictateIOS:
    build:
      targets:
        GroqDictateIOS: all
    test:
      targets:
        - GroqDictateIOSTests

targets:
  GroqDictate:
    type: application
    platform: macOS
    sources:
      - path: Sources
      - path: GroqDictate/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.groqdictate
        DEVELOPMENT_TEAM: G729H95F8U
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_FILE: GroqDictate/Info.plist
        CODE_SIGN_ENTITLEMENTS: GroqDictate/GroqDictate.entitlements
        CODE_SIGN_STYLE: Automatic
        SWIFT_OPTIMIZATION_LEVEL[config=Release]: -Osize
        OTHER_LDFLAGS:
          - -Xlinker
          - -dead_strip
        GENERATE_INFOPLIST_FILE: false
    entitlements:
      path: GroqDictate/GroqDictate.entitlements

  GroqDictateTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/GroqDictateTests
    dependencies:
      - target: GroqDictate
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true

  GroqDictateIOS:
    type: application
    platform: iOS
    sources:
      - path: iOS/Sources
      - path: iOS/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.groqdictate.ios
        DEVELOPMENT_TEAM: G729H95F8U
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_FILE: iOS/Info.plist
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: false

  GroqDictateIOSTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: iOS/Tests
    dependencies:
      - target: GroqDictateIOS
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
